<style>
/* Layout: three option cards in a column; each pairs a phone mock (before/after) with plain-English trade-offs. */
:root{--bg:#f4f6f5;--card:#fff;--fg:#14201b;--muted:#566660;--line:#d6dfdb;--accent:#1f7a52;--soft:#e4f3ec;--ad:#e0a526;--phone:#0f1714;--screen:#1b2723;--sfg:#e8f0ec;--smuted:#8fa39b;--f-head:"Space Grotesk",system-ui,sans-serif;--f-body:Inter,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1411;--card:#16201c;--fg:#e8f0ec;--muted:#9bada5;--line:#2a3833;--accent:#58c995;--soft:#1a2c24;--phone:#050806;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1411;--card:#16201c;--fg:#e8f0ec;--muted:#9bada5;--line:#2a3833;--accent:#58c995;--soft:#1a2c24;--phone:#050806;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);margin:0;padding-block:24px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:900px;margin:0 auto;display:grid;gap:18px}
h1,h2{font-family:var(--f-head);margin:0;text-wrap:balance}
h1{font-size:clamp(26px,5vw,36px);line-height:1.1}
.lead{color:var(--muted);margin:8px 0 0;max-width:62ch}
.opt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:16px;cursor:pointer;min-width:0}
.opt:has(input:checked){border-color:var(--accent);background:var(--soft)}
.opt:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.oh{display:flex;gap:12px;align-items:flex-start}
.oh input{width:22px;height:22px;margin-top:3px;accent-color:var(--accent);flex:none}
.oh h2{font-size:20px}
.oh p{margin:4px 0 0;color:var(--muted)}
.rec{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.shots{display:flex;gap:18px;flex-wrap:wrap}
figure{margin:0;display:grid;gap:6px;justify-items:center}
figcaption{font-size:12px;color:var(--muted);text-align:center;max-width:170px}
.ph{width:150px;background:var(--phone);border-radius:20px;padding:7px}
.sc{background:var(--screen);color:var(--sfg);border-radius:14px;height:210px;padding:9px;display:flex;flex-direction:column;gap:6px;font-size:10px;overflow:hidden}
.sc b{font-size:11px}.row{display:flex;justify-content:space-between;gap:6px;color:var(--smuted)}
.vid{height:62px;border-radius:6px;background:linear-gradient(135deg,#2c5c7a,#17323f);display:grid;place-items:center;font-size:18px}
.ad{margin-top:auto;background:var(--ad);color:#1a1300;border-radius:5px;text-align:center;font-weight:700;padding:9px 4px;font-size:10px}
.gap{margin-top:auto;height:30px;border:1px dashed var(--smuted);border-radius:5px;display:grid;place-items:center;color:var(--smuted)}
.sw{display:flex;justify-content:space-between;align-items:center;background:#24332d;border-radius:6px;padding:5px 7px}
.tog{width:22px;height:12px;border-radius:8px;background:#58c995;position:relative}.tog::after{content:"";position:absolute;right:2px;top:2px;width:8px;height:8px;border-radius:50%;background:#0d1411}
.tog.off{background:#4b5a54}.tog.off::after{right:auto;left:2px;background:#cfd8d4}
ul{margin:0;padding-left:18px;color:var(--muted)}li+li{margin-top:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));text-align:center;font-weight:600}
</style>

<header><h1>Ads inside streaming, sport and game apps</h1>
<p class="lead">Your cricket app still shows an ad banner. Apps that stream video, play music or run games stay outside the ad shield today, so their ads get through. Pick how the app should treat them.</p></header>

<label class="opt"><div class="oh"><input type="radio" name="v" checked><div><span class="rec">Recommended</span><h2>A. Filter ads in every app</h2><p>Streaming, sport and game apps join the shield. They are still never slowed and always get full speed.</p></div></div>
<div class="shots">
<figure><div class="ph"><div class="sc"><b>AUS 7-191 v ENG</b><div class="row"><span>Mitch Marsh</span><span>37</span></div><div class="row"><span>Sam Harper</span><span>32</span></div><div class="ad">ON SALE NOW</div></div></div><figcaption>Today: banner ad shows</figcaption></figure>
<figure><div class="ph"><div class="sc"><b>AUS 7-191 v ENG</b><div class="row"><span>Mitch Marsh</span><span>37</span></div><div class="row"><span>Sam Harper</span><span>32</span></div><div class="gap">ad gone</div></div></div><figcaption>After: the banner is blocked</figcaption></figure></div>
<ul><li>Most ads vanish everywhere on your phone.</li><li>A tiny chance a stream starts a moment slower, because its traffic now passes through the shield.</li><li>Any app that misbehaves can be set back to "skip the shield".</li></ul></label>

<label class="opt"><div class="oh"><input type="radio" name="v"><div><h2>B. You choose app by app</h2><p>Streaming, sport and game apps stay outside the shield until you switch one on in the Apps tab.</p></div></div>
<div class="shots"><figure><div class="ph"><div class="sc"><b>Apps</b><div class="sw"><span>Cricket</span><span class="tog"></span></div><div class="sw"><span>Netflix</span><span class="tog off"></span></div><div class="sw"><span>YouTube</span><span class="tog off"></span></div><div class="sw"><span>Games</span><span class="tog off"></span></div></div></div><figcaption>A new "Ad shield" switch per app</figcaption></figure></div>
<ul><li>Streaming stays exactly as it is until you decide.</li><li>You do the tapping; ads stay in any app you leave off.</li></ul></label>

<label class="opt"><div class="oh"><input type="radio" name="v"><div><h2>C. Leave it as it is</h2><p>Streaming, sport and game apps keep skipping the shield, so their ads stay.</p></div></div>

<ul><li>Zero risk to streaming.</li><li>The ad in your cricket app stays.</li></ul></label>
</div>
