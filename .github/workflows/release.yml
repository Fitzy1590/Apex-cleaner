name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Check and build
        run: ./gradlew check assembleDebug
      - name: Name the file
        run: cp app/build/outputs/apk/debug/app-debug.apk "ApexCleaner-${GITHUB_REF_NAME}.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "ApexCleaner-${GITHUB_REF_NAME}.apk" \
            --title "Apex Cleaner ${GITHUB_REF_NAME}: Fast-Charge Accelerator" \
            --prerelease \
            --notes "Safe fast-charge care on plug-in, live wattage and charger type, lock-screen charging card, in-app charging card with speed curve and battery health, default 80% charge limit alert, and an unplug alert at 100%. Test build: install the .apk file on your phone."
