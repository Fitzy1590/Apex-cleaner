name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v1.1.0"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Check and build
        run: ./gradlew check assembleDebug
      - name: Name the file
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: cp app/build/outputs/apk/debug/app-debug.apk "ApexCleaner-${VERSION}.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          gh release create "$VERSION" "ApexCleaner-${VERSION}.apk" --target "$GITHUB_SHA" \
            --title "Apex Cleaner ${VERSION}: Fast-Charge Accelerator" \
            --prerelease \
            --notes "Safe fast-charge care on plug-in, live wattage and charger type, lock-screen charging card, in-app charging card with speed curve and battery health, default 80% charge limit alert, and an unplug alert at 100%. Test build: install the .apk file on your phone."
